<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nova Obra</title>
    <link rel="stylesheet" href="estilo2.css">
</head>
<body>

    <div class="form-page-container">
        
        <header class="header">
            <h1 class="titulo">Cadastrar Equipe</h1>
            <a href="index.html" class="btn-voltar">← Voltar ao Catálogo</a>
        </header>

        <main class="content">
            <form id="formLocalizacao" class="formulario-cadastro">
    
            <div class="input-grupo">
                <label for="nomeLocal">Nome do Local:</label>
                <input type="text" id="nomeLocal" required placeholder="Ex: Gotham City">
            </div>

            <div class="input-grupo">
                <label for="universo">Universo:</label>
                <input type="text" id="universo" required placeholder="Ex: Terra-1">
            </div>

            <button type="submit" class="btn-enviar">Cadastrar Localização</button>
            </form>

        <footer class="footer">
            <p>&copy; 2026 - Um Catálogo</p>
        </footer>

    </div>

    <!-- O seu script que lida com o envio do formulário -->
    <script src="index.js"></script>
</body>
</html>
