<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nova Obra</title>
    <link rel="stylesheet" href="estilo2.css">
</head>
<body>

    <div class="page-container form-container">
        
        <header class="header">
            <h1 class="titulo">Cadastrar Obra de Arte</h1>
            <a href="index.html" class="btn-voltar">← Voltar ao Catálogo</a>
        </header>

        <main class="content">
            <form id="meuFormulario" class="formulario-cadastro">
                
                <div class="input-grupo">
                    <label for="titulo">Título da Obra:</label>
                    <input type="text" id="titulo" required placeholder="Ex: Noite Estrelada">
                </div>

                <div class="input-grupo">
                    <label for="imagem">URL da Imagem:</label>
                    <input type="url" id="imagem" required placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="input-grupo">
                    <label for="descricao">Descrição (Alt da Imagem):</label>
                    <input type="text" id="descricao" required placeholder="Breve descrição da imagem para acessibilidade">
                </div>

                <div class="input-grupo">
                    <label for="paragrafo">Parágrafo / Texto sobre a Obra:</label>
                    <textarea id="paragrafo" rows="4" required placeholder="Escreva sobre a obra..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Cadastrar Obra</button>
            </form>
        </main>

        <footer class="footer">
            <p>&copy; 2026 - Catálogo Red Hood</p>
        </footer>

    </div>

    <!-- O seu script que lida com o envio do formulário -->
    <script src="index.js"></script>
</body>
</html>
